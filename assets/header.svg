<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <radialGradient id="halo" cx="0.82" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#8400e0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8400e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trazo" x1="0" x2="1">
      <stop offset="0%" stop-color="#8400e0"/>
      <stop offset="100%" stop-color="#c77dff"/>
    </linearGradient>
    <pattern id="malla" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .base { fill: #0a0712; }
    .nombre { font: 600 60px "Helvetica Neue", Arial, sans-serif; fill: #f5f0ff; letter-spacing: -1.2px; animation: subir 1.2s cubic-bezier(.2,.7,.2,1) both; }
    .rol { font: 400 22px "Helvetica Neue", Arial, sans-serif; fill: #a99bc0; animation: subir 1.2s cubic-bezier(.2,.7,.2,1) 0.2s both; }
    .etiqueta { font: 500 13px "Helvetica Neue", Arial, sans-serif; fill: #8f7fa8; letter-spacing: 3px; animation: subir 1.2s ease-out 0.5s both; }
    .regla { stroke: url(#trazo); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: trazar 1.6s ease-in-out 0.3s forwards; }
    .hoja { fill: none; stroke: #c77dff; stroke-width: 1.3; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: trazar 2.6s ease-in-out 0.6s forwards; filter: url(#brillo); }
    .nervio { fill: none; stroke: #c77dff; stroke-opacity: 0.4; stroke-width: 1; stroke-dasharray: 1; stroke-dashoffset: 1; animation: trazar 1.8s ease-in-out 2s forwards; }
    @keyframes subir { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes trazar { to { stroke-dashoffset: 0; } }
  </style>
  <defs>
    <filter id="brillo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect class="base" width="1200" height="340" rx="14"/>
  <rect width="1200" height="340" rx="14" fill="url(#halo)"/>
  <rect width="1200" height="340" rx="14" fill="url(#malla)"/>

  <path class="hoja" pathLength="1" d="M 960 78 C 1012 104, 1034 146, 1026 186 C 1016 228, 984 252, 960 258 C 936 248, 904 222, 896 184 C 888 144, 908 102, 960 78 Z"/>
  <path class="nervio" pathLength="1" d="M 960 94 C 958 146, 960 206, 956 250"/>
  <path class="nervio" pathLength="1" d="M 962 146 C 976 150, 986 158, 994 170"/>
  <path class="nervio" pathLength="1" d="M 958 200 C 946 204, 936 212, 928 222"/>

  <text class="etiqueta" x="72" y="92">SISTEMAS COMPLEJOS · INTELIGENCIA ARTIFICIAL</text>
  <text class="nombre" x="72" y="170">Jessica Melani Romero Lora</text>
  <text class="rol" x="74" y="212">Detección sistémica de anomalías con datos y procesos</text>
  <rect class="regla" x="74" y="248" width="120" height="2" rx="1" pathLength="1"/>
</svg>
