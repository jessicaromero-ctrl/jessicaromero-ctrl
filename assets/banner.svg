<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <style>
    .fondo { fill: #faf7ff; }
    .nombre { font: 600 58px "Helvetica Neue", Arial, sans-serif; fill: #14101c; letter-spacing: -1px; animation: entrar 1.1s ease-out both; }
    .rol { font: 400 24px "Helvetica Neue", Arial, sans-serif; fill: #5b4b6e; animation: entrar 1.1s ease-out 0.25s both; }
    .linea { stroke: #8400e0; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: trazar 2.4s ease-in-out 0.4s forwards; }
    .hoja { fill: none; stroke: #8400e0; stroke-width: 1.4; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: trazar 2.8s ease-in-out forwards; }
    .nervio { stroke: #8400e0; stroke-opacity: 0.45; stroke-width: 1; fill: none; stroke-dasharray: 1; stroke-dashoffset: 1; animation: trazar 2s ease-in-out 1.6s forwards; }
    .acento { fill: #8400e0; opacity: 0.12; animation: respirar 4s ease-in-out infinite; transform-origin: 1010px 140px; }
    .pie { font: 400 15px "Helvetica Neue", Arial, sans-serif; fill: #8a7a9c; letter-spacing: 2px; animation: entrar 1.2s ease-out 0.8s both; }
    @keyframes entrar { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes trazar { to { stroke-dashoffset: 0; } }
    @keyframes respirar { 0%, 100% { transform: scale(1); opacity: 0.10; } 50% { transform: scale(1.06); opacity: 0.16; } }
  </style>

  <rect class="fondo" width="1200" height="280" rx="16"/>

  <circle class="acento" cx="1010" cy="140" r="110"/>

  <!-- Contorno de hoja con nervio central: se dibuja al cargar -->
  <path class="hoja" pathLength="1" d="M 1010 58 C 1060 84, 1078 122, 1070 160 C 1060 200, 1030 222, 1010 226 C 990 218, 958 196, 950 158 C 942 118, 960 82, 1010 58 Z"/>
  <path class="nervio" pathLength="1" d="M 1010 72 C 1008 120, 1010 180, 1006 222"/>
  <path class="nervio" pathLength="1" d="M 1012 120 C 1026 124, 1036 132, 1044 142"/>
  <path class="nervio" pathLength="1" d="M 1008 170 C 996 174, 986 182, 978 192"/>

  <text class="nombre" x="64" y="128">Jessica Melani Romero Lora</text>
  <text class="rol" x="66" y="170">Complex Systems Scientist · IA para detección sistémica de anomalías</text>
  <path class="linea" pathLength="1" d="M 66 200 L 170 200"/>
  <text class="pie" x="66" y="240">VISIÓN ARTIFICIAL  ·  PROCESS MINING  ·  EVALUACIÓN RIGUROSA</text>
</svg>
